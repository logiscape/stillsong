<!-- @dsCard group="Spacing" viewport="700x180" name="Motion" subtitle="Slow, serene easing; nothing bounces" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--ground);padding:18px 20px;font:var(--ui-md);color:var(--text-body)}.sw{border-radius:var(--radius-sm);border:1px solid var(--line-1)}.g{display:grid;gap:10px}.n{font:var(--mono-sm);color:var(--text-faint);margin-top:6px;display:block}.l{font:var(--ui-xs);color:var(--text-quiet);display:block}@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(120px)}}.b{width:26px;height:26px;border-radius:50%;background:var(--brass);animation:slide 3.4s infinite}</style>
</head><body><div style="display:flex;flex-direction:column;gap:12px;font:var(--ui-sm)">
<div style="display:flex;align-items:center;gap:16px"><div class="b" style="animation-timing-function:var(--ease-out)"></div><span class="n">--ease-out cubic-bezier(.2,.8,.24,1) · enters, hovers</span></div>
<div style="display:flex;align-items:center;gap:16px"><div class="b" style="animation-timing-function:var(--ease-serene)"></div><span class="n">--ease-serene (.32,.06,.24,1) · photo drift, reveals</span></div>
<div><span class="n">tap 110 · fast 180 · base 280 · slow 520 · reveal 880 · breath 6200 · kenburns 150s</span></div></div></body></html>
