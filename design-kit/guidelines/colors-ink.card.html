<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--ground);padding:18px 20px;font:var(--ui-md);color:var(--text-body)}.sw{border-radius:var(--radius-sm);border:1px solid var(--line-1)}.g{display:grid;gap:10px}.n{font:var(--mono-sm);color:var(--text-faint);margin-top:6px;display:block}.l{font:var(--ui-xs);color:var(--text-quiet);display:block}</style>
</head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div><div class="sw" style="height:74px;background:var(--ink-1)"></div><span class="l">ink-1 / titles</span><span class="n">#F5EEE6</span></div><div><div class="sw" style="height:74px;background:var(--ink-2)"></div><span class="l">ink-2 / body</span><span class="n">#CBBFB4</span></div><div><div class="sw" style="height:74px;background:var(--ink-3)"></div><span class="l">ink-3 / quiet</span><span class="n">#9A8F86</span></div><div><div class="sw" style="height:74px;background:var(--ink-4)"></div><span class="l">ink-4 / faint</span><span class="n">#6E645D</span></div><div><div class="sw" style="height:74px;background:var(--ink-inverse)"></div><span class="l">ink-inverse</span><span class="n">#171412</span></div></div></body></html>
