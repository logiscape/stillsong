<!-- @dsCard group="Colors" viewport="700x170" name="Ambient colour" subtitle="--ambient is written per photo from its dominant colour at import" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--ground);padding:18px 20px;font:var(--ui-md);color:var(--text-body)}.sw{border-radius:var(--radius-sm);border:1px solid var(--line-1)}.g{display:grid;gap:10px}.n{font:var(--mono-sm);color:var(--text-faint);margin-top:6px;display:block}.l{font:var(--ui-xs);color:var(--text-quiet);display:block}</style>
</head><body><div class="g" style="grid-template-columns:repeat(4,1fr)"><div><div class="sw" style="height:88px;background:radial-gradient(120% 100% at 30% 20%,#3A2F28,var(--ground) 78%)"></div><span class="l">harbour, dusk</span><span class="n">--ambient: #3A2F28</span></div><div><div class="sw" style="height:88px;background:radial-gradient(120% 100% at 30% 20%,#4A3A2E,var(--ground) 78%)"></div><span class="l">long field, rain</span><span class="n">--ambient: #4A3A2E</span></div><div><div class="sw" style="height:88px;background:radial-gradient(120% 100% at 30% 20%,#2A3239,var(--ground) 78%)"></div><span class="l">winter window</span><span class="n">--ambient: #2A3239</span></div><div><div class="sw" style="height:88px;background:radial-gradient(120% 100% at 30% 20%,#43302F,var(--ground) 78%)"></div><span class="l">kitchen, late</span><span class="n">--ambient: #43302F</span></div></div></body></html>
