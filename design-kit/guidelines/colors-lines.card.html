<!-- @dsCard group="Colors" viewport="700x150" name="Hairlines & washes" subtitle="Warm white at 4–28% — the only way surfaces separate" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--ground);padding:18px 20px;font:var(--ui-md);color:var(--text-body)}.sw{border-radius:var(--radius-sm);border:1px solid var(--line-1)}.g{display:grid;gap:10px}.n{font:var(--mono-sm);color:var(--text-faint);margin-top:6px;display:block}.l{font:var(--ui-xs);color:var(--text-quiet);display:block}</style>
</head><body><div class="g" style="grid-template-columns:repeat(7,1fr)"><div><div class="sw" style="height:74px;background:var(--line-1)"></div><span class="l">line-1 · 9%</span><span class="n">hairline default</span></div><div><div class="sw" style="height:74px;background:var(--line-2)"></div><span class="l">line-2 · 16%</span><span class="n">fields, hover</span></div><div><div class="sw" style="height:74px;background:var(--line-3)"></div><span class="l">line-3 · 28%</span><span class="n">strong</span></div><div><div class="sw" style="height:74px;background:var(--wash-1)"></div><span class="l">wash-1 · 4%</span><span class="n">ghost hover</span></div><div><div class="sw" style="height:74px;background:var(--wash-2)"></div><span class="l">wash-2 · 7%</span><span class="n">track</span></div><div><div class="sw" style="height:74px;background:var(--wash-3)"></div><span class="l">wash-3 · 12%</span><span class="n">pressed</span></div><div><div class="sw" style="height:74px;background:var(--brass-wash)"></div><span class="l">brass-wash</span><span class="n">selected</span></div></div></body></html>
