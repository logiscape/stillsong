<!-- @dsCard group="Brand" viewport="700x170" name="Glass & blur" subtitle="Blur only over photographs — never over the app ground" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--ground);padding:18px 20px;font:var(--ui-md);color:var(--text-body)}.sw{border-radius:var(--radius-sm);border:1px solid var(--line-1)}.g{display:grid;gap:10px}.n{font:var(--mono-sm);color:var(--text-faint);margin-top:6px;display:block}.l{font:var(--ui-xs);color:var(--text-quiet);display:block}</style>
</head><body><div style="position:relative;height:126px;border-radius:var(--radius-photo);overflow:hidden">
<img src="https://picsum.photos/seed/stillsong-glass/1200/400" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
<div style="position:absolute;inset:0;display:flex;gap:16px;align-items:center;padding:0 18px">
<div style="flex:1;padding:14px 16px;border-radius:var(--radius-lg);background:var(--panel-blur-bg);backdrop-filter:var(--blur-panel);border:1px solid var(--line-1);font:var(--ui-sm);color:var(--ink-1)">--panel-blur · blur(22px) saturate(115%)</div>
<div style="flex:1;padding:14px 16px;border-radius:var(--radius-pill);background:rgba(12,11,10,.42);backdrop-filter:var(--blur-chrome);border:1px solid var(--line-2);font:var(--ui-sm);color:var(--ink-1)">--blur-chrome · blur(12px)</div>
</div></div></body></html>
