<!-- @dsCard group="Colors" viewport="700x150" name="Semantic pigments" subtitle="Muted sage, amber, clay — pigment, not signal-light" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--ground);padding:18px 20px;font:var(--ui-md);color:var(--text-body)}.sw{border-radius:var(--radius-sm);border:1px solid var(--line-1)}.g{display:grid;gap:10px}.n{font:var(--mono-sm);color:var(--text-faint);margin-top:6px;display:block}.l{font:var(--ui-xs);color:var(--text-quiet);display:block}</style>
</head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div><div class="sw" style="height:74px;background:var(--sage)"></div><span class="l">success / sage</span><span class="n">#7F9A76</span></div><div><div class="sw" style="height:74px;background:var(--amber)"></div><span class="l">warning / amber</span><span class="n">#CE9B45</span></div><div><div class="sw" style="height:74px;background:var(--clay)"></div><span class="l">danger / clay</span><span class="n">#B4664C</span></div><div><div class="sw" style="height:74px;background:var(--sage-wash)"></div><span class="l">sage-wash</span><span class="n">15% on ground</span></div><div><div class="sw" style="height:74px;background:var(--amber-wash)"></div><span class="l">amber-wash</span><span class="n">15% on ground</span></div><div><div class="sw" style="height:74px;background:var(--clay-wash)"></div><span class="l">clay-wash</span><span class="n">16% on ground</span></div></div></body></html>
