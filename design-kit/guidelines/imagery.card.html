<!-- @dsCard group="Brand" viewport="700x180" name="Photo treatment" subtitle="User photos are never filtered — only scrimmed, rounded and slowly drifted" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--ground);padding:18px 20px;font:var(--ui-md);color:var(--text-body)}.sw{border-radius:var(--radius-sm);border:1px solid var(--line-1)}.g{display:grid;gap:10px}.n{font:var(--mono-sm);color:var(--text-faint);margin-top:6px;display:block}.l{font:var(--ui-xs);color:var(--text-quiet);display:block}</style>
</head><body><div class="g" style="grid-template-columns:repeat(4,1fr)"><div><div class="sw" style="height:112px;border-radius:var(--radius-photo);overflow:hidden;box-shadow:var(--shadow-photo)"><img src="https://picsum.photos/seed/stillsong-p1/500/400" style="width:100%;height:100%;object-fit:cover"></div><span class="n">no filter</span></div><div><div class="sw" style="height:112px;border-radius:var(--radius-photo);overflow:hidden;box-shadow:var(--shadow-photo)"><img src="https://picsum.photos/seed/stillsong-p2/500/400" style="width:100%;height:100%;object-fit:cover"></div><span class="n">4:3 thumb</span></div><div><div class="sw" style="height:112px;border-radius:var(--radius-photo);overflow:hidden;box-shadow:var(--shadow-photo)"><img src="https://picsum.photos/seed/stillsong-p3/500/400" style="width:100%;height:100%;object-fit:cover"></div><span class="n">12px radius</span></div><div><div class="sw" style="height:112px;border-radius:var(--radius-photo);overflow:hidden;box-shadow:var(--shadow-photo)"><img src="https://picsum.photos/seed/stillsong-p4/500/400" style="width:100%;height:100%;object-fit:cover"></div><span class="n">soft deep shadow</span></div></div></body></html>
