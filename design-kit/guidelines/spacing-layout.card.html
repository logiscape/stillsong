<!-- @dsCard group="Spacing" viewport="700x180" name="Layout measures" subtitle="Screen gutter, panel padding, lyric measure, grid gap" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--ground);padding:18px 20px;font:var(--ui-md);color:var(--text-body)}.sw{border-radius:var(--radius-sm);border:1px solid var(--line-1)}.g{display:grid;gap:10px}.n{font:var(--mono-sm);color:var(--text-faint);margin-top:6px;display:block}.l{font:var(--ui-xs);color:var(--text-quiet);display:block}</style>
</head><body><div style="display:flex;flex-direction:column;gap:10px;font:var(--ui-sm)">
<div style="display:flex;align-items:center;gap:12px"><div style="width:var(--gutter-screen);height:10px;background:var(--brass-700)"></div><span>--gutter-screen 48px</span></div>
<div style="display:flex;align-items:center;gap:12px"><div style="width:var(--gutter-panel);height:10px;background:var(--brass-600)"></div><span>--gutter-panel 24px</span></div>
<div style="display:flex;align-items:center;gap:12px"><div style="width:var(--grid-gap);height:10px;background:var(--brass-300)"></div><span>--grid-gap 20px (Sanctuary)</span></div>
<div style="display:flex;align-items:center;gap:12px"><div style="width:var(--rail-width);height:10px;background:var(--surface-4)"></div><span>--rail-width 280px · --measure-lyric 34ch · --control-h 40 / 48 · --hit-min 44</span></div></div></body></html>
