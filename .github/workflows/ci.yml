name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Node mirrors of the Rust manifest logic (tree digest, on-media
      # layout) pinned to the same fixtures the cargo tests use.
      - run: node --test scripts/tree-digest.test.mjs physical-release/lib/layout.test.mjs
      # Static + network checks on the pinned manifest: hashes well-formed,
      # every pinned URL on the allowlist, every redirect hop https, sizes as
      # stated, the tree-bound ComfyUI tarball fetched and digested; reports
      # which CDN hosts the hops land on.
      # The offline bootstrap itself runs in first-run.yml.
      - run: node scripts/check-manifest.mjs

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
